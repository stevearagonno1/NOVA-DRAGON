name: Build OpenCrabs
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev build-essential zip
          
      - name: Clone and Build
        run: |
          git clone https://github.com/adolfousier/opencrabs.git source_code
          cd source_code
          cargo build --release
          
          # ضغط الملف بصيغة zip لضمان مروره من حد جيت هاب
          zip -j ../opencrabs.zip target/release/opencrabs
          
      - name: Commit Binary
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add opencrabs.zip
          git commit -m "Add ZIPPED OpenCrabs binary"
          git push
